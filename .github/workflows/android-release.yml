name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Call of Doodle APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Accept Licenses (API 36)
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_DIR" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager non trovato in $SDK_DIR"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-36"
          set -o pipefail

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Web App & Sync Capacitor Android
        run: |
          npm run build
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Prepare Android Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="/tmp/callofdoodle-release.keystore"
          rm -f "$KEYSTORE_PATH"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS_SECRET" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias callofdoodle \
              -storepass callofdoodle123 \
              -keypass callofdoodle123 \
              -dname "CN=Call of Doodle, OU=Mobile, O=CallOfDoodle, L=Home, S=Italy, C=IT"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=callofdoodle123" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=callofdoodle" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=callofdoodle123" >> "$GITHUB_ENV"
          fi
          ls -lh "$KEYSTORE_PATH"

      - name: Compile Android Release APK with Gradle
        working-directory: android
        run: |
          set -o pipefail
          if command -v gradle >/dev/null 2>&1; then
            GRADLE_CMD="gradle"
          else
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          fi
          $GRADLE_CMD assembleRelease \
            --no-daemon \
            --stacktrace \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName="1.0.${{ github.run_number }}"

      - name: Package & Verify Signed APK
        run: |
          APK_SRC="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1 || true)"
          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "::error::APK non trovato in android/app/build/outputs/apk/release"
            ls -la android/app/build/outputs/apk/release || true
            exit 1
          fi
          APK_NAME="Call-of-Doodle-v1.0.${{ github.run_number }}.apk"
          cp "$APK_SRC" "$APK_NAME"
          echo "APK_FILENAME=$APK_NAME" >> "$GITHUB_ENV"
          ls -lh "$APK_NAME"

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Call-of-Doodle-v1.0.${{ github.run_number }}-APK
          path: ${{ env.APK_FILENAME }}
          if-no-files-found: error

      - name: Create GitHub Release with Downloadable APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Call of Doodle v1.0.${{ github.run_number }} (Android APK)
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ### 📱 Call of Doodle — Build Android APK `v1.0.${{ github.run_number }}`

            **Come installare sul telefono Android:**
            1. Scarica il file **`${{ env.APK_FILENAME }}`** qui sotto nella sezione **Assets**.
            2. Apri il file APK scaricato sul telefono (se richiesto, consenti l'installazione da app sconosciute/browser).
            3. Avvia **Call of Doodle** in modalità orizzontale immersiva a schermo intero!

            *Commit:* `${{ github.sha }}`
          files: |
            ${{ env.APK_FILENAME }}
